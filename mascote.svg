<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" width="440" height="500">
  <defs>
    <radialGradient id="halo-m" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#F0A5C4" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#C9B8EE" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#7ED4C0" stop-opacity="0"/>
    </radialGradient>

    <pattern id="listras" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#F7F2E8"/>
      <rect x="3.6" width="1.3" height="9" fill="#46557A" opacity=".75"/>
    </pattern>

    <linearGradient id="cabelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2F42"/>
      <stop offset="100%" stop-color="#241C2C"/>
    </linearGradient>

    <clipPath id="corte-lente-e"><circle cx="90" cy="112" r="18"/></clipPath>
    <clipPath id="corte-lente-d"><circle cx="130" cy="112" r="18"/></clipPath>
  </defs>

  <!-- brilho de fundo -->
  <circle cx="110" cy="112" r="96" fill="url(#halo-m)"/>

  <g id="corpo">
    <!-- cabelo por trás -->
    <path d="M110 30c-40 0-58 28-58 66 0 26 3 46 1 62-1 12-6 22-11 30h136c-5-8-10-18-11-30-2-16 1-36 1-62 0-38-18-66-58-66z" fill="url(#cabelo)"/>

    <!-- ombros e camisa listrada -->
    <path d="M60 250c2-30 16-46 34-52h32c18 6 32 22 34 52z" fill="url(#listras)"/>
    <path d="M94 198c6 10 10 16 16 22 6-6 10-12 16-22l-8-4h-16z" fill="#F7F2E8" stroke="#DED6C6" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M94 198l16 22-22 12-10-26z" fill="#FBF7EF" stroke="#DED6C6" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M126 198l-16 22 22 12 10-26z" fill="#FBF7EF" stroke="#DED6C6" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- pescoço -->
    <path d="M96 168h28v22c0 8-28 8-28 0z" fill="#C99468"/>

    <!-- rosto -->
    <ellipse cx="110" cy="115" rx="45" ry="52" fill="#E3B084"/>
    <ellipse cx="66" cy="118" rx="7" ry="10" fill="#DDA97C"/>
    <ellipse cx="154" cy="118" rx="7" ry="10" fill="#DDA97C"/>

    <!-- franja com risca ao meio -->
    <path d="M78 68c-8 15-14 33-16 55-4-23-2-43 6-60z" fill="url(#cabelo)"/>
    <path d="M142 68c8 15 14 33 16 55 4-23 2-43-6-60z" fill="url(#cabelo)"/>
    <path d="M110 32c-3 10-4 18-4 26" stroke="#4A3D55" stroke-width="1.6" fill="none" opacity=".65" stroke-linecap="round"/>
    <path d="M62 106c-4 30-2 56-6 74 10-6 14-22 14-40 0-14-2-24-8-34z" fill="url(#cabelo)"/>
    <path d="M158 106c4 30 2 56 6 74-10-6-14-22-14-40 0-14 2-24 8-34z" fill="url(#cabelo)"/>

    <!-- sobrancelhas -->
    <path d="M79 96c6-4 14-4 19 0" stroke="#2A2233" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M122 96c5-4 13-4 19 0" stroke="#2A2233" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- olhos -->
    <g id="olhos">
      <ellipse cx="90" cy="112" rx="4.6" ry="5.4" fill="#2A2233"/>
      <ellipse cx="130" cy="112" rx="4.6" ry="5.4" fill="#2A2233"/>
      <circle cx="91.6" cy="110" r="1.5" fill="#fff" opacity=".85"/>
      <circle cx="131.6" cy="110" r="1.5" fill="#fff" opacity=".85"/>
    </g>

    <!-- óculos redondos -->
    <g id="oculos">
      <circle cx="90" cy="112" r="18" fill="#C9B8EE" fill-opacity=".16" stroke="#2A2233" stroke-width="3"/>
      <circle cx="130" cy="112" r="18" fill="#C9B8EE" fill-opacity=".16" stroke="#2A2233" stroke-width="3"/>
      <path d="M108 111c2-2 2-2 4 0" stroke="#2A2233" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M72 110l-10-3M148 110l10-3" stroke="#2A2233" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g opacity=".5">
        <path d="M80 124l14-22" stroke="#fff" stroke-width="3" stroke-linecap="round" clip-path="url(#corte-lente-e)"/>
        <path d="M120 124l14-22" stroke="#fff" stroke-width="3" stroke-linecap="round" clip-path="url(#corte-lente-d)"/>
      </g>
    </g>

    <!-- nariz e sorriso -->
    <path d="M110 122c2 4 2 6-1 7" stroke="#C08A5E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M99 140q11 10 22 0" stroke="#C4708F" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M101 141q9 7 18 0" fill="#fff" opacity=".9"/>

    <!-- bochechas -->
    <ellipse cx="78" cy="132" rx="8" ry="5" fill="#F0A5C4" opacity=".38"/>
    <ellipse cx="142" cy="132" rx="8" ry="5" fill="#F0A5C4" opacity=".38"/>
  </g>
</svg>
